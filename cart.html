<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Tu carrito | Kasvy</title>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
        rel="stylesheet"
    >
</head>

<body>
    <header class="site-header">
        <a class="brand" href="index.html" aria-label="Kasvy, inicio">
            Kasvy
        </a>

        <nav class="nav" aria-label="Navegación principal">
            <a href="index.html">Inicio</a>
            <a href="products.html">Tienda</a>

            <a
                class="cart-link"
                href="cart.html"
                aria-label="Ver carrito"
                aria-current="page"
            >
                <span class="cart-icon" aria-hidden="true">🛒</span>
                <span id="cart-count" class="cart-count">0</span>
            </a>
        </nav>
    </header>

    <main class="container" aria-labelledby="titulo-carrito">
        <h1 id="titulo-carrito">Tu rincón verde empieza aquí</h1>

        <p>
            Revisa tus plantas, ajusta las cantidades
            o elimina los productos que quieras cambiar.
        </p>

        <div id="cart-summary" class="cart-summary" role="status">
            <div>
                <strong>Unidades:</strong>
                <span id="total-items">0</span>
            </div>

            <div>
                <strong>Total de productos:</strong>
                $<span id="total-cost">0.00</span> MXN
            </div>
        </div>

        <div id="cart-items" class="cart-items"></div>

        <div class="cart-actions">
            <a class="btn secondary" href="products.html">
                Seguir explorando
            </a>

            <button
                type="button"
                id="checkout-btn"
                class="btn primary"
                disabled
            >
                Compra de demostración
            </button>
        </div>

        <p style="margin-top: 24px; color: var(--texto-secundario);">
            <small>
                Precios
            </small>
        </p>
    </main>

    <script src="js/store.js"></script>
    <script src="js/scripts.js"></script>
</body>
</html>
